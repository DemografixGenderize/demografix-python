[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demografix"
version = "0.2.0"
description = "Predict gender, age, and nationality from names. Official Python client for the genderize.io, agify.io, and nationalize.io APIs, with batches of up to 100 names per request."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Demografix", email = "info@genderize.io" }]
keywords = [
    "gender",
    "age",
    "nationality",
    "name",
    "first name",
    "gender detection",
    "gender from name",
    "age prediction",
    "name prediction",
    "demographics",
    "batch",
    "bulk",
    "api",
    "api client",
    "genderize",
    "agify",
    "nationalize",
    "demografix",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://genderize.io"
Documentation = "https://genderize.io/documentation/api"
Repository = "https://github.com/DemografixGenderize/demografix-python"
Issues = "https://github.com/DemografixGenderize/demografix-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/demografix"]
# PEP 561: ship the py.typed marker so type checkers pick up the inline types.
force-include = { "src/demografix/py.typed" = "demografix/py.typed" }
